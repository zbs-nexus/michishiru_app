<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>散歩アプリ</title>
</head>
<body>
    <h1>散歩ルート案内アプリ</h1>
    <button onclick="testConnect()">接続テスト</button>
    <p id="result">結果がここに表示されます</p>

    <script>
        async function testConnect() {
            // STEP 3で作成するAPI URLをここに貼り付けます
            const apiUrl = 'YOUR_API_GATEWAY_URL/test';
            try {
                const res = await fetch(apiUrl);
                const data = await res.json();
                document.getElementById('result').innerText = JSON.stringify(data);
            } catch (e) {
                document.getElementById('result').innerText = 'エラー: ' + e;
            }
        }
    </script>
</body>
</html>
