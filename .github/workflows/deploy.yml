name: Deploy

# develop への push → 開発環境(dev)、main への push → 本番環境(prod) をデプロイする。
# 手動実行でデプロイ先を選ぶこともできる。
# デプロイの前に品質チェック(checks)を実行し、成功した場合のみデプロイする。
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      stage:
        description: デプロイ先の環境
        type: choice
        options: [dev, prod]
        default: dev

# 環境ごとにデプロイの同時実行を防ぐ
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # デプロイ前の品質ゲート（build・test・synth）
  checks:
    uses: ./.github/workflows/checks.yml

  # デプロイ先を決める。
  # GitHub の Environment 名はブランチ名に合わせる（develop / main）。
  # Environment はジョブの開始時に解決されるため、同じジョブ内のステップの出力は使えない。
  # そのためこのジョブで先に決め、deploy ジョブが needs 経由で受け取る。
  setup:
    name: デプロイ先の決定
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.vars.outputs.stage }}
      environment: ${{ steps.vars.outputs.environment }}
    steps:
      - name: ブランチまたは手動入力から stage と Environment を決める
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STAGE="${{ github.event.inputs.stage }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            STAGE="prod"
          else
            STAGE="dev"
          fi

          if [ "$STAGE" = "prod" ]; then
            ENVIRONMENT="main"
          else
            ENVIRONMENT="develop"
          fi

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "デプロイ先: stage=$STAGE / Environment=$ENVIRONMENT"

  deploy:
    name: build & deploy
    needs: [checks, setup]
    runs-on: ubuntu-latest
    # デプロイ履歴を環境ごとに残すための指定。Environment 名はブランチ名に対応する。
    # Cognito の接続情報は Environment 変数ではなく、cdk deploy の出力から受け取る。
    environment: ${{ needs.setup.outputs.environment }}
    env:
      AWS_REGION: ap-northeast-1
      STAGE: ${{ needs.setup.outputs.stage }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # OIDC でデプロイ用 IAM ロールを引き受ける
      - name: AWS認証情報を設定する（OIDC）
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # createRoute の Lambda は esbuild で依存ごとバンドルするため、
      # cdk deploy の前に backend の依存を揃えておく
      - name: backend の依存を取得（Lambda のバンドルに必要）
        working-directory: backend
        run: npm ci

      # 先にインフラだけをデプロイする。
      # Cognito のユーザープールは CDK で作るため、その ID はデプロイ後に確定する。
      # この時点では frontend/dist が無いため、静的ファイルのアップロードはスキップされる。
      - name: インフラをデプロイする（cdk deploy・1回目）
        working-directory: iac
        run: |
          npm ci
          npx cdk deploy "Michishiru-$STAGE" \
            -c withBackend=true \
            --require-approval never \
            --outputs-file cdk-outputs.json

      # スタックの出力から Cognito の接続情報を取り出し、後続のステップへ渡す。
      # ID を人が登録する必要はなく、常にデプロイしたプールの値が使われる。
      # VITE_ で始まる値は import.meta.env としてビルド成果物に埋め込まれる。
      # 実行時には読み込まれないため、ビルド前に環境変数として渡す必要がある。
      # 値は GITHUB_ENV へ書き出して後続のステップへ引き継ぐ。
      - name: Cognito の接続情報をスタック出力から取り出す
        run: node tools/exportCognitoOutputs.js

      # フロントエンドをビルドする（dist は次の cdk deploy で S3 へアップロードされる）
      # VITE_COGNITO_* は直前のステップが GITHUB_ENV へ書き込んだ値を使う。
      - name: フロントエンドをビルドする
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 2回目のデプロイで静的ファイルを配信する。
      # MichishiruStack 内の BucketDeployment が frontend/dist を S3 へ同期し、
      # CloudFront のキャッシュ無効化まで行う。
      - name: フロントエンドを配信する（cdk deploy・2回目）
        working-directory: iac
        run: |
          npx cdk deploy "Michishiru-$STAGE" \
            -c withBackend=true \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: スタックの出力を表示する
        working-directory: iac
        run: cat cdk-outputs.json
