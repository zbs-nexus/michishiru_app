name: Deploy

# develop への push → 開発環境(dev)、main への push → 本番環境(prod) をデプロイする。
# 手動実行でデプロイ先を選ぶこともできる。
# デプロイの前に品質チェック(checks)を実行し、成功した場合のみデプロイする。
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      stage:
        description: デプロイ先の環境
        type: choice
        options: [dev, prod]
        default: dev

# 環境ごとにデプロイの同時実行を防ぐ
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # デプロイ前の品質ゲート（build・test・synth）
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: build & deploy
    needs: checks
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v4

      # ブランチ or 手動入力からデプロイ先の stage を決める
      - name: デプロイ先の環境を決定する
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STAGE="${{ github.event.inputs.stage }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            STAGE="prod"
          else
            STAGE="dev"
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "デプロイ先: $STAGE"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # OIDC でデプロイ用 IAM ロールを引き受ける
      - name: AWS認証情報を設定する（OIDC）
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # フロントエンドをビルドする（dist は cdk deploy で S3 へアップロードされる）
      - name: フロントエンドをビルドする
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # createRoute の Lambda は esbuild で依存ごとバンドルするため、
      # cdk deploy の前に backend の依存を揃えておく
      - name: backend の依存を取得（Lambda のバンドルに必要）
        working-directory: backend
        run: npm ci

      # 対象環境のスタックをデプロイする。
      # MichishiruStack 内の BucketDeployment が frontend/dist を S3 へ同期し、
      # CloudFront のキャッシュ無効化まで行う。
      # withBackend=true でバックエンド（Lambda + API Gateway + DynamoDB）も含めてデプロイする。
      - name: インフラをデプロイする（cdk deploy）
        working-directory: iac
        run: |
          npm ci
          npx cdk deploy "Michishiru-${{ steps.vars.outputs.stage }}" \
            -c withBackend=true \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: スタックの出力を表示する
        working-directory: iac
        run: cat cdk-outputs.json
