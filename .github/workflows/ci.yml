name: CI

# develop / main 向けの PR で品質チェック（build・test）を実行する。
# （develop / main への push 時は Deploy ワークフローがデプロイ前に同じチェックを実行する）
on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
